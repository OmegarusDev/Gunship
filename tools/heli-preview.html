<!doctype html>
<meta charset="utf-8" />
<title>Gunship planforms</title>
<style>
  html,
  body {
    margin: 0;
    background: #14140e;
    color: #e8d8a0;
    font: 13px/1.35 'Courier New', monospace;
  }
  canvas {
    display: block;
    margin: 16px auto;
    background: #d4b56a;
  }
  p {
    text-align: center;
    margin: 8px 24px 24px;
  }
</style>
<canvas id="c" width="1100" height="1820"></canvas>
<p>
  Left = planform. Right = in-game with slow yaw (bank deform + world-locked sheen). Bottom = the
  same airframe at four sortie hours.
</p>
<script type="module">
  import { drawGunship } from '../js/render/entities.js';
  import { GUNSHIPS, GUNSHIP_ORDER } from '../js/meta.js';
  import { formatClock, periodLabel } from '../js/sun.js';

  const ctx = document.getElementById('c').getContext('2d');
  const rows = GUNSHIP_ORDER;
  const SAMPLE_HOURS = [4, 11, 18, 23];
  const YAW_RATE = 0.42;

  function frame(now) {
    const t = now / 1000;
    const angle = t * YAW_RATE;
    const bank = Math.max(-0.22, Math.min(0.22, -YAW_RATE * 0.09));

    ctx.fillStyle = '#d4b56a';
    ctx.fillRect(0, 0, 1100, 1820);

    rows.forEach((id, i) => {
      const y = 110 + i * 240;
      const def = GUNSHIPS[id];
      ctx.fillStyle = '#6a5a30';
      ctx.fillRect(20, y - 88, 1060, 220);
      ctx.fillStyle = '#1a1810';
      ctx.font = 'bold 16px "Courier New", monospace';
      ctx.textAlign = 'left';
      ctx.fillText(`${def.name}  (${def.year})`, 36, y - 62);
      ctx.font = '12px "Courier New", monospace';
      ctx.fillText('PLANFORM', 150, y + 86);
      ctx.fillText('IN-GAME', 720, y + 86);

      const base = {
        gunshipId: id,
        rotorBlades: def.rotorBlades,
        airframeScale: def.size || 1,
        drawScale: 1.85,
        bladeAngle: t * 8,
      };
      drawGunship(ctx, { ...base, x: 250, y, angle: 0, bank: 0, hour: 14, hideRotor: true });
      drawGunship(ctx, {
        ...base,
        x: 820,
        y,
        angle,
        bank,
        hour: 12,
        hideRotor: false,
      });
    });

    ctx.fillStyle = '#6a5a30';
    ctx.fillRect(20, 1548, 1060, 250);
    ctx.fillStyle = '#1a1810';
    ctx.font = 'bold 16px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.fillText('SORTIE HOUR  —  DAP sheen at 04:00 / 11:00 / 18:00 / 23:00', 36, 1576);

    const def = GUNSHIPS.dap;
    SAMPLE_HOURS.forEach((hour, i) => {
      const x = 140 + i * 250;
      const y = 1690;
      drawGunship(ctx, {
        gunshipId: 'dap',
        rotorBlades: def.rotorBlades,
        airframeScale: def.size || 1,
        drawScale: 1.55,
        bladeAngle: t * 8,
        x,
        y,
        angle: 0.72,
        bank: 0,
        hour,
        hideRotor: false,
      });
      ctx.fillStyle = '#1a1810';
      ctx.font = '12px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(`${formatClock(hour)}  ${periodLabel(hour)}`, x, y + 86);
    });

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
</script>
