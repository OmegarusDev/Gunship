<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a2414">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gunship">
  <meta name="application-name" content="Gunship">
  <meta name="description" content="Helicopter combat roguelite. Take the contract, fly the op, extract.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <title>Gunship: Freedom Protocol</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="pwa-chrome" class="pwa-chrome hidden">
    <button id="pwa-install" class="pwa-chip hidden" type="button">HOW TO INSTALL</button>
    <button id="pwa-fullscreen" class="pwa-chip hidden" type="button">FULLSCREEN</button>
  </div>
  <button id="pwa-update" class="pwa-chip pwa-chip-update hidden" type="button">UPDATE READY — TAP</button>
  <div id="pwa-install-help" class="pwa-help hidden">
    <div class="pwa-help-card" role="dialog" aria-labelledby="pwa-help-title">
      <div class="pwa-help-titlebar">
        <h2 id="pwa-help-title">INSTALL GUNSHIP</h2>
        <button id="pwa-install-help-close" type="button" aria-label="Close">X</button>
      </div>
      <div class="pwa-help-body">
        <p><strong>Chrome / Edge (Android &amp; desktop):</strong> tap the install icon in the address bar, or open the browser menu and choose <em>Install app</em> / <em>Cast, save, and share → Install page as app</em>.</p>
        <p><strong>iPhone / iPad:</strong> Safari → Share → Add to Home Screen.</p>
        <p>The installed app launches fullscreen.</p>
      </div>
    </div>
  </div>
  <script type="module">
    import('./js/app.js').catch(e => {
      console.error('[Gunship BOOT]', e);
    });
  </script>
</body>
</html>
